<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMPLBAG :: 4x4 Sampler</title>
  <style>
    :root {
      /* palette */
      --bg:      #06070b;
      --dev:     #0e1018;
      --screen:  #090b12;
      --panel:   #141720;
      --text:    #ffffff;
      --dim:     #8890aa;
      --sublabel: #aab0c8;
      --note:    #f5c050;
      --ok:      #44ee77;
      --play:    #55bbff;
      --warn:    #ffaa22;
      --rec:     #ff3333;
      --border:  #1e2235;
      --border2: #2e3450;
      /* structural / chrome */
      --dev-border:   #1c2030;
      --shadow-outer: #08090e;
      --screen-border: #0f1220;
      --btn-shadow:    #04050a;
      --btn-hover-bg:  #161928;
      --pad-btn-bg:    #0e1018;
      --pad-btn-hover: #131620;
      --pad-stop-bg:   #09090f;
      --sm-shadow:     #03030a;
      /* pad state tints */
      --rec-pad-border:    #3a1515;
      --rec-head-bg:       #0e0508;
      --rec-head-border:   #2a0f0f;
      --play-pad-border:   #153525;
      --play-head-bg:      #060e08;
      --play-head-border:  #0f2a18;
      --rec-pulse-from:    #140508;
      --rec-pulse-to:      #1e080d;
      /* monitor */
      --monitor-sep: #0d0f18;
    }

    body.light {
      --bg:      #d8dae0;
      --dev:     #f2f3f7;
      --screen:  #ffffff;
      --panel:   #e4e6ee;
      --text:    #0a0b10;
      --dim:     #5a5f78;
      --sublabel: #383c52;
      --note:    #8a5f00;
      --ok:      #1a7a3a;
      --play:    #1558aa;
      --warn:    #b06000;
      --rec:     #c01010;
      --border:  #b8bacf;
      --border2: #9a9cb8;
      --dev-border:   #9a9cb8;
      --shadow-outer: #b0b2c8;
      --screen-border: #c8cad8;
      --btn-shadow:    #8890aa;
      --btn-hover-bg:  #e8eaf4;
      --pad-btn-bg:    #eceef8;
      --pad-btn-hover: #e4e6f4;
      --pad-stop-bg:   #f4f5fc;
      --sm-shadow:     #9090a8;
      --rec-pad-border:   #e8a0a0;
      --rec-head-bg:      #fff0f0;
      --rec-head-border:  #f0c0c0;
      --play-pad-border:  #70c090;
      --play-head-bg:     #f0fff5;
      --play-head-border: #a0d8b8;
      --rec-pulse-from:   #fff0f0;
      --rec-pulse-to:     #ffe4e4;
      --monitor-sep: #d0d2e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'Menlo', 'Courier New', Courier, monospace;
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
      font-size: 13px;
    }

    /* ── Device shell ─────────────────────────────────── */
    .device {
      width: min(560px, 100%);
      margin: 0 auto;
      background: var(--dev);
      border: 1px solid var(--dev-border);
      box-shadow: 0 0 0 3px var(--shadow-outer), 0 24px 72px rgba(0,0,0,0.5);
    }

    /* ── Screen bar ───────────────────────────────────── */
    .screen-bar {
      background: var(--screen);
      border-bottom: 2px solid var(--screen-border);
      padding: 7px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }
    .screen-bar .title    { color: var(--note); font-weight: bold; }
    .screen-bar .subtitle { color: var(--sublabel); }

    /* ── Sections ─────────────────────────────────────── */
    .section {
      border-bottom: 1px solid var(--border);
      padding: 9px 12px;
    }
    .section:last-child { border-bottom: none; }

    .section-label {
      color: var(--sublabel);
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    /* ── Generic form controls ────────────────────────── */
    select, input[type="number"] {
      background: var(--screen);
      color: var(--text);
      border: 1px solid var(--border2);
      padding: 4px 6px;
      font-family: inherit;
      font-size: 0.78rem;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    select:focus, input:focus { border-color: var(--dim); }

    /* ── Button base ──────────────────────────────────── */
    .btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border2);
      border-bottom: 2px solid var(--btn-shadow);
      border-right: 2px solid var(--btn-shadow);
      padding: 4px 9px;
      font-family: inherit;
      font-size: 0.76rem;
      cursor: pointer;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .btn:hover:not([disabled]) {
      background: var(--btn-hover-bg);
      border-color: var(--dim);
      border-bottom-color: var(--btn-shadow);
      border-right-color: var(--btn-shadow);
    }
    .btn:active:not([disabled]) {
      transform: translate(1px, 1px);
      border-bottom-width: 1px;
      border-right-width: 1px;
    }
    .btn[disabled] { opacity: 0.3; cursor: not-allowed; }

    /* ── Status lines ─────────────────────────────────── */
    .status { font-size: 0.72rem; color: var(--dim); margin-top: 5px; min-height: 1em; }
    .status.ok     { color: var(--ok); }
    .status.warn   { color: var(--warn); }
    .status.danger { color: var(--rec); }

    /* ── Audio row ────────────────────────────────────── */
    .audio-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .audio-row > select { flex: 1; min-width: 140px; }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--sublabel);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .ctrl-group input[type="number"] { width: 52px; }

    /* ── Pad grid ─────────────────────────────────────── */
    .pad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    /* ── Individual pad ───────────────────────────────── */
    .pad {
      background: var(--screen);
      border: 1px solid var(--border2);
      display: flex;
      flex-direction: column;
    }

    .pad-head {
      padding: 4px 6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      gap: 4px;
    }
    .pad-note     { color: var(--note); font-weight: bold; letter-spacing: 0.06em; white-space: nowrap; }
.pad-arm-label {
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      color: var(--sublabel);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }
    .pad-arm-label input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      width: 11px;
      height: 11px;
      border: 1px solid var(--border2);
      background: var(--panel);
      cursor: pointer;
      flex-shrink: 0;
    }
    .pad-arm-label input[type="checkbox"]:checked {
      background: var(--ok);
      border-color: var(--ok);
    }

    /* armed state: tint the whole pad */
    .pad.armed .pad-arm-label { color: var(--ok); }

    .pad-main-wrap {
      padding: 5px 6px 4px;
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* ── Main rec/play button — fixed square ──────────── */
    .pad-main {
      background: var(--pad-btn-bg);
      border: 1px solid var(--border2);
      border-bottom: 2px solid var(--btn-shadow);
      border-right: 2px solid var(--btn-shadow);
      color: var(--text);
      font-family: inherit;
      padding: 0;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      gap: 2px;
    }
    .pad-main:hover:not([disabled]) { background: var(--pad-btn-hover); }
    .pad-main:active:not([disabled]) {
      transform: translate(1px, 1px);
      border-bottom-width: 1px;
      border-right-width: 1px;
    }
    .pad-main[disabled] { opacity: 0.22; cursor: not-allowed; }

    /* icons and label inside pad-main */
    .pi {
      font-size: 1rem;
      line-height: 1;
      text-align: center;
    }
    .pad-main .pi { font-size: 1.3rem; }
    .pad-main .pl { font-size: 0.52rem; letter-spacing: 0.07em; }
    .pi-rec     { color: var(--rec); }
    .pi-play    { color: var(--ok); }
    .pi-retrig  { color: var(--play); }
    .pi-stoprec { color: var(--rec); }

    .pad-main.recording {
      border-color: var(--rec);
      animation: recpulse 0.7s ease-in-out infinite alternate;
    }
    @keyframes recpulse {
      from { background: var(--rec-pulse-from); }
      to   { background: var(--rec-pulse-to); }
    }
    .pad-main.playing { border-color: var(--ok); }

    /* ── Stop / Clear — small icon-only squares ───────── */
    /* two stacked beside the main button: 22+4+22 = 48px */
    .pad-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pad-stop, .pad-clear {
      background: var(--pad-stop-bg);
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--sm-shadow);
      border-right: 2px solid var(--sm-shadow);
      font-family: inherit;
      width: 22px;
      height: 22px;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pad-stop:not([disabled]):hover, .pad-clear:not([disabled]):hover {
      border-color: var(--border2);
    }
    .pad-stop:active:not([disabled]), .pad-clear:active:not([disabled]) {
      transform: translate(1px, 1px);
      border-bottom-width: 1px;
      border-right-width: 1px;
    }
    .pad-stop[disabled], .pad-clear[disabled] { opacity: 0.18; cursor: not-allowed; }
    .pad-stop  .pi { font-size: 0.65rem; color: var(--warn); }
    .pad-clear .pi { font-size: 0.65rem; color: var(--rec); }

    /* ── Output route strip ───────────────────────────── */
    .pad-route {
      padding: 3px 6px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.62rem;
      color: var(--sublabel);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .pad-route select {
      flex: 1;
      min-width: 0;
      font-size: 0.68rem;
      padding: 2px 4px;
    }

    /* ── Pad state tints ──────────────────────────────── */
    .pad.recording { border-color: var(--rec-pad-border); }
    .pad.recording .pad-head { background: var(--rec-head-bg); border-color: var(--rec-head-border); }
    .pad.playing   { border-color: var(--play-pad-border); }
    .pad.playing   .pad-head { background: var(--play-head-bg); border-color: var(--play-head-border); }
    .pad.has-clip  .pad-note { color: var(--ok); }
    .pad.disarmed  { opacity: 0.65; }
    .pad.disarmed .pad-main { opacity: 0.5; }

    /* ── MIDI section ─────────────────────────────────── */
    .midi-ctrl-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      margin-bottom: 6px;
    }
    .midi-ctrl-row .label {
      color: var(--text);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .pill {
      display: inline-block;
      border: 1px solid var(--border2);
      background: var(--panel);
      font-size: 0.65rem;
      padding: 2px 6px;
      color: var(--text);
      margin: 2px 2px 0 0;
    }

    /* ── MIDI monitor ─────────────────────────────────── */
    .monitor-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 9px;
    }
    .monitor {
      font-family: inherit;
      font-size: 0.7rem;
      background: var(--screen);
      border: 1px solid var(--border);
      padding: 5px 8px;
      height: 130px;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
      gap: 1px;
      margin-top: 6px;
    }
    .monitor-row {
      display: grid;
      grid-template-columns: 52px 40px 38px 56px 60px 1fr;
      gap: 6px;
      padding: 1px 0;
      border-bottom: 1px solid var(--monitor-sep);
      white-space: nowrap;
    }
    .mt-time { color: var(--dim); }
    .mt-ch   { color: var(--sublabel); }
    .mt-type { color: var(--play); }
    .mt-note { color: var(--note); }
    .mt-vel  { color: var(--ok); }
    .mt-hit  { color: var(--rec); font-weight: bold; }

    @media (max-width: 700px) {
      .pad-grid { grid-template-columns: repeat(2, 1fr); }
      .audio-row { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="device">

    <div class="screen-bar">
      <span class="title">SMPLBAG</span>
      <span class="subtitle">CLIP SAMPLER/LAUNCHER // NO SERVER</span>
      <button class="btn" id="modeToggle" type="button" style="font-size:0.68rem;padding:2px 8px;">[LIT]</button>
    </div>

    <div class="section">
      <div class="section-label">Audio Input</div>
      <div class="audio-row">
        <select id="audioSource"></select>
        <button class="btn" id="refreshDevicesBtn" type="button">[Refresh]</button>
        <div class="ctrl-group">
          OFFS
          <input id="triggerOffsetMs" type="number" value="0" min="-200" max="200" step="1" />
          ms
        </div>
        <div class="ctrl-group">
          TEST OUT
          <select id="outputTestChannel" style="width:76px;"></select>
          <button class="btn" id="testOutputBtn" type="button">[Test]</button>
        </div>
      </div>
      <div id="audioStatus" class="status"></div>
    </div>

    <div class="section">
      <div class="section-label">Pads</div>
      <div id="padGrid" class="pad-grid"></div>
      <div id="clipStatus" class="status">No clips recorded yet.</div>
    </div>

    <div class="section">
      <div class="midi-ctrl-row">
        <span class="label">MIDI</span>
        <div class="ctrl-group">
          CH
          <select id="midiChannelSel" style="width:68px;">
            <option value="-1">ALL</option>
            <option value="0">1</option>
            <option value="1">2</option>
            <option value="2">3</option>
            <option value="3">4</option>
            <option value="4">5</option>
            <option value="5">6</option>
            <option value="6">7</option>
            <option value="7">8</option>
            <option value="8">9</option>
            <option value="9">10</option>
            <option value="10">11</option>
            <option value="11">12</option>
            <option value="12">13</option>
            <option value="13">14</option>
            <option value="14">15</option>
            <option value="15">16</option>
          </select>
        </div>
        <button class="btn" id="enableMidiBtn" type="button">[Enable MIDI]</button>
      </div>
      <div id="midiStatus" class="status warn">MIDI not enabled.</div>
      <div id="midiInputs" class="status"></div>
      <div class="monitor-head">
        <span style="font-size:0.68rem;color:var(--sublabel);text-transform:uppercase;letter-spacing:0.1em;">MIDI Monitor</span>
        <button class="btn" id="clearMonitorBtn" type="button" style="padding:2px 7px;font-size:0.65rem;">[Clear]</button>
      </div>
      <div id="midiMonitor" class="monitor"></div>
    </div>

  </div>

  <script>
    const PAD_COUNT = 16;
    const COLS = 4;
    const ROWS = PAD_COUNT / COLS;
    const ARM_NOTE_OFFSET = 24;

    // Notes start at 0 bottom-left, go right then up.
    function padMidiNote(i) {
      const rowFromBottom = (ROWS - 1) - Math.floor(i / COLS);
      return rowFromBottom * COLS + (i % COLS);
    }

    const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    // Display convention used here: MIDI note 0 = C1.
    function midiNoteName(n) {
      return NOTE_NAMES[n % 12] + (Math.floor(n / 12) + 1);
    }

    const ui = {
      audioSource: document.getElementById('audioSource'),
      refreshDevicesBtn: document.getElementById('refreshDevicesBtn'),
      triggerOffsetMs: document.getElementById('triggerOffsetMs'),
      outputTestChannel: document.getElementById('outputTestChannel'),
      testOutputBtn: document.getElementById('testOutputBtn'),
      audioStatus: document.getElementById('audioStatus'),
      clipStatus: document.getElementById('clipStatus'),
      padGrid: document.getElementById('padGrid'),
      enableMidiBtn: document.getElementById('enableMidiBtn'),
      midiChannelSel: document.getElementById('midiChannelSel'),
      midiStatus: document.getElementById('midiStatus'),
      midiInputs: document.getElementById('midiInputs'),
      midiMonitor: document.getElementById('midiMonitor'),
      clearMonitorBtn: document.getElementById('clearMonitorBtn')
    };

    const pads = [];
    let mediaStream = null;
    let activeDeviceId = null;
    let midiAccess = null;
    const audioContext = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    const MAX_OUTPUT_CHANNEL_OPTIONS = 32;

    function getOutputChannelCount() {
      const maxCount = audioContext.destination.maxChannelCount
        || audioContext.destination.channelCount
        || 2;
      return Math.max(1, Math.min(MAX_OUTPUT_CHANNEL_OPTIONS, maxCount));
    }

    const outputChannelCount = getOutputChannelCount();

    try {
      audioContext.destination.channelCountMode = 'explicit';
      audioContext.destination.channelInterpretation = 'discrete';
      audioContext.destination.channelCount = outputChannelCount;
    } catch {
      // Some browser/device combos keep these readonly.
    }

    function fillOutputSelect(selectEl, selectedIndex = 0) {
      if (!selectEl) return;
      selectEl.innerHTML = '';
      for (let ch = 0; ch < outputChannelCount; ch += 1) {
        const opt = document.createElement('option');
        opt.value = String(ch);
        opt.textContent = `Out ${ch + 1}`;
        selectEl.appendChild(opt);
      }
      const safeIndex = Math.max(0, Math.min(outputChannelCount - 1, selectedIndex));
      selectEl.value = String(safeIndex);
    }

    function setStatus(el, text, tone = '') {
      el.classList.remove('ok', 'warn', 'danger');
      if (tone) el.classList.add(tone);
      el.textContent = text;
    }

    async function resumeAudioContext() {
      if (audioContext.state === 'suspended') {
        try { await audioContext.resume(); } catch { /* ignore */ }
      }
    }

    async function decodePadBlobToBuffer(pad) {
      if (!pad.blob) return false;
      try {
        const arr = await pad.blob.arrayBuffer();
        const decoded = await audioContext.decodeAudioData(arr.slice(0));
        pad.buffer = decoded;
        return true;
      } catch {
        pad.buffer = null;
        return false;
      }
    }

    async function playOutputTestTone() {
      try {
        await resumeAudioContext();
        const selectedOut = Number.parseInt(ui.outputTestChannel.value, 10);
        const outIndex = Number.isInteger(selectedOut)
          ? Math.max(0, Math.min(outputChannelCount - 1, selectedOut))
          : 0;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const route = audioContext.createChannelMerger(outputChannelCount);
        const now = audioContext.currentTime;

        osc.type = 'sine';
        osc.frequency.value = 330 + (outIndex * 55);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);

        osc.connect(gain);
        gain.connect(route, 0, outIndex);
        route.connect(audioContext.destination);

        osc.start(now);
        osc.stop(now + 0.45);
        osc.onended = () => {
          try { osc.disconnect(); } catch { /* ignore */ }
          try { gain.disconnect(); } catch { /* ignore */ }
          try { route.disconnect(); } catch { /* ignore */ }
        };

        setStatus(ui.audioStatus, `Testing Out ${outIndex + 1}. If only Out 1-2 are audible, the browser is likely collapsing to stereo.`, 'warn');
      } catch (err) {
        setStatus(ui.audioStatus, `Output test failed: ${err.message || err}`, 'danger');
      }
    }

    function releaseStream() {
      mediaStream?.getTracks().forEach(track => track.stop());
      mediaStream = null;
      activeDeviceId = null;
    }

    function buildInputConstraints(deviceId) {
      // These are browser-level constraints, not macOS global settings.
      // Browsers may ignore some fields depending on hardware and policy.
      const audio = {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1,
        latency: 0,
        sampleRate: 48000,
        sampleSize: 16
      };
      if (deviceId) audio.deviceId = { exact: deviceId };
      return { audio };
    }

    function getInputSettingsSummary() {
      const t = mediaStream?.getAudioTracks?.()[0];
      if (!t) return '';
      const s = t.getSettings?.() || {};
      return `ec:${s.echoCancellation ?? '-'} ns:${s.noiseSuppression ?? '-'} agc:${s.autoGainControl ?? '-'} sr:${s.sampleRate ?? '-'} ch:${s.channelCount ?? '-'} lat:${s.latency ?? '-'}`;
    }

    async function ensureStream(deviceId) {
      if (mediaStream && activeDeviceId === deviceId) return mediaStream;
      releaseStream();
      const constraints = buildInputConstraints(deviceId);
      mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
      activeDeviceId = deviceId;
      return mediaStream;
    }

    function chooseMimeType() {
      const candidates = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm', 'audio/ogg'];
      for (const type of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
      }
      return '';
    }

    function safeDeviceLabel(device, idx) {
      return device.label || `Input ${idx + 1} (${device.deviceId.slice(0, 6)}…)`;
    }

    async function refreshAudioDevices() {
      if (!navigator.mediaDevices?.enumerateDevices) {
        setStatus(ui.audioStatus, 'Audio device listing unsupported.', 'danger');
        return;
      }

      try { await ensureStream(ui.audioSource.value || null); } catch { /* ignore */ }
      const devices = await navigator.mediaDevices.enumerateDevices();
      const inputs = devices.filter(d => d.kind === 'audioinput');
      const previous = ui.audioSource.value;
      ui.audioSource.innerHTML = '';

      if (!inputs.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No audio inputs found';
        ui.audioSource.appendChild(opt);
        setStatus(ui.audioStatus, 'No microphone / USB input found.', 'danger');
        return;
      }

      inputs.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = safeDeviceLabel(d, i);
        ui.audioSource.appendChild(opt);
      });

      if ([...ui.audioSource.options].some(o => o.value === previous)) ui.audioSource.value = previous;
      const streamSettings = getInputSettingsSummary();
      setStatus(ui.audioStatus, `Found ${inputs.length} audio input device(s), ${outputChannelCount} output channel(s). ${streamSettings}`.trim(), 'ok');
    }

    function padMainHTML(rec, play, has) {
      if (rec)  return '<span class="pi pi-stoprec">&#9632;</span><span class="pl"> STOP REC</span>';
      if (play) return '<span class="pi pi-retrig">&gt;&gt;</span><span class="pl"> RETRIG</span>';
      if (has)  return '<span class="pi pi-play">&gt;</span><span class="pl"> PLAY</span>';
      return '<span class="pi pi-rec">O</span><span class="pl"> REC</span>';
    }

    function createPad(index) {
      const el = document.createElement('div');
      el.className = 'pad';
      const note = padMidiNote(index);
      el.innerHTML = `
        <div class="pad-head">
          <span class="pad-note">${midiNoteName(note)}</span>
          <label class="pad-arm-label">
            ARM (${midiNoteName(note + ARM_NOTE_OFFSET)})
            <input id="arm-${index}" type="checkbox" />
          </label>
        </div>
        <div class="pad-main-wrap">
          <button class="pad-main" id="padMain-${index}" type="button">
            <span class="pi pi-rec">O</span><span class="pl"> REC</span>
          </button>
          <div class="pad-actions">
            <button class="pad-stop" id="padStop-${index}" type="button" disabled title="Stop">
              <span class="pi">&#9632;</span>
            </button>
            <button class="pad-clear" id="padClear-${index}" type="button" disabled title="Clear">
              <span class="pi">&#10005;</span>
            </button>
          </div>
        </div>
        <div class="pad-route">
          <select id="padOut-${index}"></select>
        </div>
      `;
      ui.padGrid.appendChild(el);

      const pad = {
        index,
        note,
        mediaRecorder: null,
        chunks: [],
        blob: null,
        url: null,
        buffer: null,
        activeSource: null,
        activeRoute: null,
        isPlaying: false,
        mainBtn: el.querySelector(`#padMain-${index}`),
        stopBtn: el.querySelector(`#padStop-${index}`),
        clearBtn: el.querySelector(`#padClear-${index}`),
        armedChk: el.querySelector(`#arm-${index}`),
        outputSel: el.querySelector(`#padOut-${index}`)
      };

      fillOutputSelect(pad.outputSel, 0);

      pad.mainBtn.addEventListener('click', () => triggerPad(pad, 'Button'));
      pad.stopBtn.addEventListener('click', () => stopPad(pad));
      pad.clearBtn.addEventListener('click', () => clearPad(pad));
      pad.armedChk.addEventListener('change', () => {
        if (!pad.armedChk.checked && (isRecording(pad) || isPlaying(pad))) {
          stopPad(pad);
        }
        updatePadUI(pad);
      });

      pads.push(pad);
      updatePadUI(pad);
    }

    function buildPads() {
      for (let i = 0; i < PAD_COUNT; i += 1) createPad(i);
    }

    function isRecording(pad) {
      return !!pad.mediaRecorder && pad.mediaRecorder.state === 'recording';
    }

    function isStopping(pad) {
      return !!pad.mediaRecorder && pad.mediaRecorder.state === 'inactive';
    }

    function isPlaying(pad) {
      return !!pad.isPlaying;
    }

    function updatePadUI(pad) {
      const rec   = isRecording(pad);
      const play  = isPlaying(pad);
      const has   = !!pad.blob;
      const armed = !!pad.armedChk?.checked;
      const padEl = pad.mainBtn.closest('.pad');

      pad.mainBtn.classList.toggle('recording', rec);
      pad.mainBtn.classList.toggle('playing', play && !rec);
      pad.clearBtn.disabled = !has || rec;
      pad.stopBtn.disabled  = !play && !rec;
      pad.mainBtn.disabled  = !armed && !rec && !play;

      padEl.classList.toggle('recording', rec);
      padEl.classList.toggle('playing',   play && !rec);
      padEl.classList.toggle('has-clip',  has);
      padEl.classList.toggle('armed',     armed);
      padEl.classList.toggle('disarmed',  !armed);

      pad.mainBtn.innerHTML = padMainHTML(rec, play, has);
    }

    async function startPadRecording(pad, sourceLabel) {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus(ui.clipStatus, 'Recording is not supported in this browser.', 'danger');
        return;
      }

      if (isRecording(pad) || isStopping(pad)) return;

      let stream;
      try {
        stream = await ensureStream(ui.audioSource.value || null);
      } catch (err) {
        setStatus(ui.clipStatus, `Could not access audio input: ${err.message || err}`, 'danger');
        return;
      }

      const mimeType = chooseMimeType();
      try {
        pad.mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      } catch (err) {
        setStatus(ui.clipStatus, `Recorder setup failed: ${err.message || err}`, 'danger');
        pad.mediaRecorder = null;
        return;
      }

      pad.chunks = [];
      pad.mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) pad.chunks.push(e.data);
      };

      pad.mediaRecorder.onstop = async () => {
        const type = pad.mediaRecorder?.mimeType || 'audio/webm';
        pad.blob = new Blob(pad.chunks, { type });
        if (pad.url) URL.revokeObjectURL(pad.url);
        pad.url = URL.createObjectURL(pad.blob);
        await decodePadBlobToBuffer(pad);
        pad.mediaRecorder = null;
        updatePadUI(pad);
        setStatus(ui.clipStatus, `Pad ${pad.index + 1}: recorded (${(pad.blob.size / 1024).toFixed(1)} KB).`, 'ok');
        saveClip(pad.index, pad.blob);
      };

      pad.mediaRecorder.onerror = e => {
        const msg = e.error?.message || e.message || 'Unknown recorder error';
        setStatus(ui.clipStatus, `Pad ${pad.index + 1}: recording error: ${msg}`, 'danger');
      };

      pad.mediaRecorder.start();
      setStatus(ui.clipStatus, `Pad ${pad.index + 1}: recording...`, 'warn');
      updatePadUI(pad);
    }

    function stopPadRecording(pad) {
      if (!isRecording(pad)) return Promise.resolve();
      return new Promise(resolve => {
        const origOnstopped = pad.mediaRecorder.onstop;
        pad.mediaRecorder.onstop = async (e) => {
          await origOnstopped(e);
          resolve();
        };
        pad.mediaRecorder.stop();
        setStatus(ui.clipStatus, `Pad ${pad.index + 1}: stopping...`, 'warn');
        updatePadUI(pad);
      });
    }

    function stopPadPlayback(pad) {
      if (!pad.activeSource) return;
      try { pad.activeSource.stop(); } catch { /* ignore */ }
      try { pad.activeSource.disconnect(); } catch { /* ignore */ }
      try { pad.activeRoute?.disconnect(); } catch { /* ignore */ }
      pad.activeSource = null;
      pad.activeRoute  = null;
      pad.isPlaying    = false;
      updatePadUI(pad);
      setStatus(ui.clipStatus, `Pad ${pad.index + 1}: stopped.`, 'ok');
    }

    function stopPad(pad) {
      if (isRecording(pad)) { stopPadRecording(pad); return; }
      if (isPlaying(pad))   { stopPadPlayback(pad); }
    }

    async function playPad(pad, sourceLabel) {
      if (!pad.blob) return;
      try {
        await resumeAudioContext();
        if (!pad.buffer) {
          const ok = await decodePadBlobToBuffer(pad);
          if (!ok) throw new Error('decode failed');
        }

        if (pad.activeSource) {
          try { pad.activeSource.stop(); } catch { /* ignore */ }
          try { pad.activeSource.disconnect(); } catch { /* ignore */ }
          try { pad.activeRoute?.disconnect(); } catch { /* ignore */ }
          pad.activeSource = null;
          pad.activeRoute  = null;
        }

        const src = audioContext.createBufferSource();
        src.buffer = pad.buffer;
        src.loop = false;
        const route = audioContext.createChannelMerger(outputChannelCount);
        const selectedOut = Number.parseInt(pad.outputSel.value, 10);
        const outIndex = Number.isInteger(selectedOut)
          ? Math.max(0, Math.min(outputChannelCount - 1, selectedOut))
          : 0;
        src.connect(route, 0, outIndex);
        route.connect(audioContext.destination);
        pad.activeSource = src;
        pad.activeRoute  = route;
        pad.isPlaying    = true;
        src.onended = () => {
          if (pad.activeSource === src) {
            try { route.disconnect(); } catch { /* ignore */ }
            pad.activeSource = null;
            pad.activeRoute  = null;
            pad.isPlaying    = false;
            updatePadUI(pad);
          }
        };
        const offsetMs = Number.parseFloat(ui.triggerOffsetMs.value);
        const safeOffsetMs = Number.isFinite(offsetMs) ? Math.max(-200, Math.min(200, offsetMs)) : 0;
        const offsetSec   = safeOffsetMs / 1000;
        const when        = audioContext.currentTime + Math.max(0, offsetSec);
        const startOffset = Math.max(0, -offsetSec);
        if (startOffset >= src.buffer.duration) {
          pad.activeSource = null;
          pad.isPlaying    = false;
          updatePadUI(pad);
          setStatus(ui.clipStatus, `Pad ${pad.index + 1}: offset too negative for clip length.`, 'warn');
          return;
        }
        src.start(when, startOffset);
        updatePadUI(pad);
        setStatus(ui.clipStatus, `Pad ${pad.index + 1}: triggered by ${sourceLabel} with offset ${startOffset}.`, 'ok');
      } catch (err) {
        setStatus(ui.clipStatus, `Pad ${pad.index + 1}: playback failed: ${err.message || err}`, 'danger');
      }
    }

    function clearPad(pad) {
      if (isRecording(pad) || isStopping(pad)) return;
      if (pad.activeSource) {
        try { pad.activeSource.stop(); } catch { /* ignore */ }
        try { pad.activeSource.disconnect(); } catch { /* ignore */ }
        try { pad.activeRoute?.disconnect(); } catch { /* ignore */ }
      }
      pad.activeSource = null;
      pad.activeRoute  = null;
      pad.isPlaying    = false;
      if (pad.url) URL.revokeObjectURL(pad.url);
      pad.url    = null;
      pad.blob   = null;
      pad.buffer = null;
      updatePadUI(pad);
      setStatus(ui.clipStatus, `Pad ${pad.index + 1}: cleared.`, 'warn');
      deleteClip(pad.index);
    }

    async function triggerPad(pad, sourceLabel) {
      if (!pad.armedChk.checked) {
        setStatus(ui.clipStatus, `Pad ${pad.index + 1}: not armed.`, 'warn');
        return;
      }
      if (isRecording(pad)) {
        if (pad.buffer) { await playPad(pad, sourceLabel); return; }
        stopPadRecording(pad);
        return;
      }
      if (isStopping(pad)) return;
      if (!pad.blob) { await startPadRecording(pad, sourceLabel); return; }
      await playPad(pad, sourceLabel);
    }

    function matchingPadsForMidi(data1) {
      return pads.filter(p => p.note === data1);
    }

    function matchingPadsForArmNote(data1) {
      return pads.filter(p => (p.note + ARM_NOTE_OFFSET) === data1);
    }

    const MONITOR_MAX = 80;

    function logMidiEvent(ch, type, data1, data2, hit) {
      const now = new Date();
      const ts = `${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}.${String(now.getMilliseconds()).padStart(3,'0').slice(0,2)}`;
      const noteName = type === 'Note' ? midiNoteName(data1) : `CC${data1}`;
      const row = document.createElement('div');
      row.className = 'monitor-row';
      row.innerHTML = `<span class="mt-time">${ts}</span><span class="mt-ch">Ch ${ch + 1}</span><span class="mt-type">${type}</span><span class="mt-note">${noteName}</span><span class="mt-vel">vel ${data2}</span><span class="mt-hit">${hit ? '> pad' : ''}</span>`;
      ui.midiMonitor.prepend(row);
      while (ui.midiMonitor.children.length > MONITOR_MAX) ui.midiMonitor.removeChild(ui.midiMonitor.lastChild);
    }

    async function handleMidiMessage(event) {
      const [status, data1, data2] = event.data;
      const command  = status & 0xf0;
      const channel  = status & 0x0f;
      const selectedChannel = Number(ui.midiChannelSel.value);
      const channelMatches  = selectedChannel === -1 || channel === selectedChannel;
      const triggerHits = channelMatches ? matchingPadsForMidi(data1) : [];
      const armHits     = channelMatches ? matchingPadsForArmNote(data1) : [];

      if (command === 0x80 || (command === 0x90 && data2 === 0)) {
        logMidiEvent(channel, 'Note', data1, data2, triggerHits.length > 0 || armHits.length > 0);
        if (!channelMatches) return;
        for (const pad of triggerHits) {
          if (isRecording(pad)) { await stopPadRecording(pad); }
        }
        return;
      }

      if (command === 0x90 || command === 0xB0) {
        const type   = command === 0x90 ? 'Note' : 'CC';
        const hasHit = command === 0x90
          ? (triggerHits.length > 0 || armHits.length > 0)
          : triggerHits.length > 0;
        logMidiEvent(channel, type, data1, data2, hasHit);
        if (!channelMatches || data2 <= 0) return;

        if (command === 0x90) {
          for (const pad of armHits) {
            pad.armedChk.checked = !pad.armedChk.checked;
            if (!pad.armedChk.checked && (isRecording(pad) || isPlaying(pad))) { stopPad(pad); }
            updatePadUI(pad);
            setStatus(ui.clipStatus, `Pad ${pad.index + 1}: ${pad.armedChk.checked ? 'armed' : 'disarmed'} (Note ${data1}).`, 'ok');
          }

          for (const pad of triggerHits) {
            if (pad.armedChk.checked) {
              if (isRecording(pad)) {
                await stopPadRecording(pad);
                if (pad.blob) await playPad(pad, `Note ${data1}`);
              } else if (isPlaying(pad)) {
                await playPad(pad, `Note ${data1}`);
              } else if (pad.blob) {
                await playPad(pad, `Note ${data1}`);
              } else {
                await startPadRecording(pad);
              }
            } else {
              setStatus(ui.clipStatus, `Pad ${pad.index + 1} is disarmed.`, 'warn');
            }
          }
        }
      }
    }

    function refreshMidiInputsUI() {
      if (!midiAccess) { ui.midiInputs.textContent = ''; return; }
      const names = [...midiAccess.inputs.values()].map(i => i.name || 'Unnamed MIDI input');
      ui.midiInputs.innerHTML = names.length
        ? names.map(name => `<span class="pill">${name}</span>`).join('')
        : '<span class="warn">No MIDI inputs detected.</span>';
    }

    function attachMidiListeners() {
      for (const input of midiAccess.inputs.values()) input.onmidimessage = handleMidiMessage;
      refreshMidiInputsUI();
    }

    async function enableMidi() {
      if (!navigator.requestMIDIAccess) {
        setStatus(ui.midiStatus, 'Web MIDI is not supported in this browser.', 'danger');
        return;
      }
      try {
        midiAccess = await navigator.requestMIDIAccess({ sysex: false });
      } catch (err) {
        setStatus(ui.midiStatus, `Could not enable MIDI: ${err.message || err}`, 'danger');
        return;
      }
      midiAccess.onstatechange = attachMidiListeners;
      attachMidiListeners();
      setStatus(ui.midiStatus, 'MIDI enabled. Note/CC now triggers mapped pads.', 'ok');
    }

    // ── IndexedDB clip persistence ────────────────────────
    const DB_NAME    = 'smplbag';
    const DB_VERSION = 1;
    const DB_STORE   = 'clips';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    async function saveClip(index, blob) {
      try {
        const db = await openDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, 'readwrite');
          tx.objectStore(DB_STORE).put(blob, index);
          tx.oncomplete = resolve;
          tx.onerror    = () => reject(tx.error);
        });
        db.close();
      } catch { /* ignore storage errors */ }
    }

    async function deleteClip(index) {
      try {
        const db = await openDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, 'readwrite');
          tx.objectStore(DB_STORE).delete(index);
          tx.oncomplete = resolve;
          tx.onerror    = () => reject(tx.error);
        });
        db.close();
      } catch { /* ignore */ }
    }

    async function loadAllClips() {
      try {
        const db = await openDB();
        const stored = await new Promise((resolve, reject) => {
          const result = {};
          const tx  = db.transaction(DB_STORE, 'readonly');
          const req = tx.objectStore(DB_STORE).openCursor();
          req.onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) { result[cursor.key] = cursor.value; cursor.continue(); }
            else resolve(result);
          };
          req.onerror = () => reject(req.error);
        });
        db.close();

        let count = 0;
        for (const [keyStr, blob] of Object.entries(stored)) {
          const pad = pads[Number(keyStr)];
          if (!pad || !blob || blob.size === 0) continue;
          pad.blob = blob;
          if (pad.url) URL.revokeObjectURL(pad.url);
          pad.url = URL.createObjectURL(blob);
          await decodePadBlobToBuffer(pad);
          updatePadUI(pad);
          count++;
        }
        if (count > 0) setStatus(ui.clipStatus, `Restored ${count} clip(s) from browser storage.`, 'ok');
      } catch { /* ignore */ }
    }

    ui.refreshDevicesBtn.addEventListener('click', refreshAudioDevices);
    ui.testOutputBtn.addEventListener('click', playOutputTestTone);
    ui.enableMidiBtn.addEventListener('click', enableMidi);
    ui.clearMonitorBtn.addEventListener('click', () => { ui.midiMonitor.innerHTML = ''; });
    ui.audioSource.addEventListener('change', () => releaseStream());
    window.addEventListener('beforeunload', () => releaseStream());

    fillOutputSelect(ui.outputTestChannel, 0);
    buildPads();
    refreshAudioDevices();
    loadAllClips();

    // ── Light / dark mode toggle ──────────────────────────
    const modeToggleBtn = document.getElementById('modeToggle');
    function applyTheme(light) {
      document.body.classList.toggle('light', light);
      modeToggleBtn.textContent = light ? '[DRK]' : '[LIT]';
    }
    applyTheme(localStorage.getItem('smplbag-theme') === 'light');
    modeToggleBtn.addEventListener('click', () => {
      const isLight = !document.body.classList.contains('light');
      applyTheme(isLight);
      localStorage.setItem('smplbag-theme', isLight ? 'light' : 'dark');
    });
  </script>
</body>
</html>
